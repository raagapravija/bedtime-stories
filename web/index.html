<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bedtime Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600;1,9..144,700&family=Nunito:wght@400;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-1: #0f1633;         /* night */
    --sky-2: #1c2552;
    --sky-3: #2c3470;
    --moon: #fbefc8;
    --walnut: #3b2416;        /* the bookcase: dark walnut */
    --walnut-hi: #5a3822;
    --walnut-dark: #22140b;
    --back: #1a0f08;          /* inside the shelves */
    --back-2: #2a190e;
    --cocoa: #4a2e1f;
    --cocoa-soft: #8a6552;
    --cream: #fff8ec;
    --text: #f3ead8;          /* text on the night sky */
    --text-soft: #c9c3dd;
    --purple: #966fd6;        /* dark pastel purple: whatever is chosen */
    --purple-deep: #7a55bd;
    --purple-soft: #ece3fa;
    --accent-text: #cdb6f2;
    --on-wood: var(--text);
    --pink: #f7c6d9; --peach: #fbd3b5; --butter: #f9e7a1; --mint: #bfe8d2; --sky: #bcdcf5;
    --lavender: #d9c9f2; --lilac: #ecc8ef; --coral: #f6b8b0; --sage: #cfe3b8; --aqua: #b8e6e6;
    /* names the reader styles use */
    --ink: #3f2d3a;
    --ink-soft: #7a6672;
    --page: #fffaf0;
    --wall-text: var(--text);
    --foil: var(--moon);
    --foil-deep: var(--purple);
    --line: #5a5f8f;
    --room: var(--sky-2);
    --display: "Fredoka", "Nunito", system-ui, sans-serif;
    --ui: "Nunito", system-ui, sans-serif;
    --body: "Literata", Georgia, serif;
    --lib-w: 0px;
  }
  * { box-sizing: border-box; }
  html { margin: 0; background: linear-gradient(var(--sky-1), var(--sky-2) 55%, var(--sky-3)) fixed var(--sky-1); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font-family: var(--ui); font-size: 17px; line-height: 1.6;
    background: transparent; overflow-x: hidden;
  }
  /* the stars and the moon stay put while the page scrolls */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1.6px 1.6px at 8% 12%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 17% 32%, #fff 98%, transparent),
      radial-gradient(2px 2px at 26% 8%, #fff7d6 98%, transparent),  radial-gradient(1.2px 1.2px at 34% 22%, #fff 98%, transparent),
      radial-gradient(1.6px 1.6px at 46% 6%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 55% 18%, #fff 98%, transparent),
      radial-gradient(2px 2px at 63% 10%, #fff7d6 98%, transparent), radial-gradient(1.2px 1.2px at 71% 28%, #fff 98%, transparent),
      radial-gradient(1.6px 1.6px at 88% 9%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 94% 30%, #fff 98%, transparent),
      radial-gradient(1.2px 1.2px at 4% 48%, #fff 98%, transparent), radial-gradient(1.6px 1.6px at 97% 52%, #fff 98%, transparent),
      radial-gradient(1.2px 1.2px at 12% 70%, #fff 98%, transparent), radial-gradient(2px 2px at 92% 76%, #fff7d6 98%, transparent),
      radial-gradient(1.2px 1.2px at 40% 40%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 78% 46%, #fff 98%, transparent),
      radial-gradient(1.6px 1.6px at 6% 90%, #fff 98%, transparent), radial-gradient(1.2px 1.2px at 52% 88%, #fff 98%, transparent);
  }
  .sky-moon {
    position: fixed; top: 34px; left: 5vw; width: 74px; height: 74px; border-radius: 50%; z-index: -1; pointer-events: none;
    box-shadow: inset -20px 6px 0 0 var(--moon); transform: rotate(-18deg);
    filter: drop-shadow(0 0 22px rgba(251,239,200,.45));
  }
  .twinkle { position: fixed; z-index: -1; pointer-events: none; width: 14px; height: 14px; background: var(--moon);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  @media (prefers-reduced-motion: no-preference) {
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle:nth-of-type(2) { animation-delay: 1.1s; } .twinkle:nth-of-type(3) { animation-delay: 2.2s; }
    @keyframes twinkle { 50% { opacity: .25; transform: scale(.7); } }
  }
  [hidden] { display: none !important; }
  main { position: relative; z-index: 1; max-width: 1500px; margin: 0 auto; padding: 0 16px 80px; }
  :focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

  .masthead { text-align: center; padding: 26px 0 0; margin: 0 0 18px; }
  .masthead h1 { margin: 0; font: 700 clamp(38px, 6.4vw, 70px)/1.05 var(--display); color: var(--moon); letter-spacing: .01em;
    text-shadow: 0 0 24px rgba(251,239,200,.35), 0 4px 0 rgba(0,0,0,.35); }
  .masthead p { margin: 8px auto 0; max-width: 36em; font-weight: 600; color: var(--text-soft); }

  /* ---------- the bookcase: the whole form lives inside it ---------- */
  .form {
    display: grid; gap: 26px; position: relative; padding: 0 clamp(14px, 2.4vw, 34px) 30px;
    border-radius: 18px 18px 8px 8px;
    background:
      linear-gradient(90deg, rgba(0,0,0,.35), transparent 3%, transparent 97%, rgba(0,0,0,.35)),
      repeating-linear-gradient(92deg, rgba(255,255,255,.025) 0 3px, transparent 3px 13px),
      var(--walnut);
    box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 0 0 3px var(--walnut-dark);
  }
  .form::before {                        /* the carved crown along the top */
    content: ""; display: block; height: 30px; margin: 0 calc(-1 * clamp(14px, 2.4vw, 34px)); border-radius: 18px 18px 0 0;
    background: linear-gradient(transparent 70%, rgba(0,0,0,.35) 70% 76%, transparent 76%),
                linear-gradient(var(--walnut-hi), var(--walnut) 80%);
    box-shadow: 0 4px 0 var(--walnut-dark);
  }

  /* ---------- the library card, pinned to the bookcase ---------- */
  .card {
    justify-self: center; width: min(620px, 100%); color: var(--cocoa); border-radius: 22px; position: relative;
    background: var(--cream); padding: 18px 28px 22px;
    box-shadow: 0 10px 0 var(--walnut-dark), 0 14px 30px rgba(0,0,0,.45);
  }
  .card::before, .card::after {          /* two brass pins */
    content: ""; position: absolute; top: 10px; width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff2c4, #c9a24d 60%, #7c5d22);
  }
  .card::before { left: 14px; } .card::after { right: 14px; }
  .card h2 { font: 700 26px var(--display); margin: 0 0 8px; text-align: center; color: var(--purple-deep); }
  .card .label { display: block; font: 600 18px var(--display); color: var(--cocoa); margin: 8px 0 6px; }
  .card input[type=text] {
    width: 100%; font: 600 20px var(--ui); color: var(--cocoa); background: #fff3e6;
    border: 3px solid #e2c7a6; border-radius: 999px; padding: 10px 20px;
  }
  .card input[type=text]::placeholder { color: #c4a58c; }
  .card input[type=text]:focus { outline: none; border-color: var(--purple); background: #fff; }
  .card .hint { font-size: 14px; color: var(--cocoa-soft); margin: 6px 0 0 8px; }
  .ages { display: flex; flex-flow: row nowrap; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .age { flex: none; }
  .age span {
    display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; cursor: pointer;
    font: 700 22px var(--display); color: var(--cocoa); background: var(--c, var(--butter));
    box-shadow: 0 4px 0 rgba(74,46,31,.35); transition: transform .15s, background .15s, color .15s;
  }
  .age span:hover { transform: translateY(-3px); }
  .age input:checked + span { background: var(--purple); color: #fff; transform: scale(1.12); box-shadow: 0 4px 0 var(--purple-deep); }
  .age input:focus-visible + span { outline: 3px solid var(--purple); outline-offset: 3px; }

  /* ---------- the shelves ---------- */
  .case-title { display: table; margin: 0 auto 18px; padding: 6px 26px 4px; border-radius: 10px;
    font: 700 24px var(--display); color: var(--cocoa);
    background: linear-gradient(#fff2c4, #e2c37a 55%, #b38a3a); box-shadow: 0 3px 0 var(--walnut-dark); }
  .cells { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 26px 18px; margin-bottom: 14px; }
  .cell { position: relative; display: block; cursor: pointer; min-width: 0; }
  .nook {
    position: relative; height: clamp(170px, 19vw, 250px); border-radius: 4px; overflow: hidden;
    display: flex; align-items: flex-end; gap: 3px; padding: 0 12px; justify-content: center;
    background: linear-gradient(var(--back), var(--back-2) 70%);
    box-shadow: inset 0 14px 22px rgba(0,0,0,.7), inset 0 -2px 0 rgba(255,255,255,.04);
    border-bottom: 16px solid var(--walnut-hi);
    transition: transform .25s ease, box-shadow .25s ease, opacity .25s ease;
  }
  .vol {                                 /* one pastel book */
    flex: none; width: var(--w); height: var(--h); border-radius: 4px 4px 1px 1px; background-color: var(--c);
    background-image: linear-gradient(transparent 12%, rgba(255,255,255,.7) 12% 15%, transparent 15% 82%,
                                      rgba(255,255,255,.7) 82% 85%, transparent 85%);
    box-shadow: inset 2px 0 0 rgba(255,255,255,.35), inset -3px 0 0 rgba(0,0,0,.12);
    transform-origin: bottom left; transition: background-color .3s, transform .25s;
  }
  .vol.lean { transform: rotate(var(--r, 14deg)); }
  .vol.leanleft { transform: rotate(var(--r, -14deg)); transform-origin: bottom right; }
  .vol.face {                            /* a book standing with its cover facing out */
    background-image: radial-gradient(circle at 50% 36%, rgba(255,255,255,.75) 0 16%, transparent 17%);
    border-radius: 3px 9px 9px 3px; border: 3px double rgba(255,255,255,.75);
    box-shadow: inset 5px 0 0 rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.4);
  }
  /* little things kept on the shelves */
  .decor { flex: none; position: relative; width: calc(var(--s, 1) * 50px); height: calc(var(--s, 1) * 62px); margin: 0 3px; }
  .decor::before, .decor::after { content: ""; position: absolute; }
  .plant::before { bottom: 0; left: 22%; width: 56%; height: 38%; background: var(--coral);
    clip-path: polygon(0 0, 100% 0, 86% 100%, 14% 100%); border-radius: 3px; }
  .plant::after { bottom: 36%; left: 6%; width: 88%; height: 62%; background:
    radial-gradient(ellipse 22% 46% at 30% 55%, var(--mint) 96%, transparent),
    radial-gradient(ellipse 22% 46% at 70% 55%, var(--sage) 96%, transparent),
    radial-gradient(ellipse 20% 50% at 50% 42%, #9fd8b4 96%, transparent); }
  .globe::before { bottom: 14%; left: 8%; width: 84%; aspect-ratio: 1; border-radius: 50%; background:
    radial-gradient(ellipse 30% 22% at 35% 40%, var(--sage) 96%, transparent),
    radial-gradient(ellipse 22% 30% at 68% 66%, var(--sage) 96%, transparent), var(--sky);
    box-shadow: inset -5px -4px 0 rgba(0,0,0,.12); }
  .globe::after { bottom: 0; left: 26%; width: 48%; height: 12%; background: #c9a24d; border-radius: 4px 4px 2px 2px; }
  .jar::before { bottom: 0; left: 10%; width: 80%; height: 74%; border-radius: 12px 12px 9px 9px;
    border: 2px solid rgba(255,255,255,.4); background:
      radial-gradient(2.5px 2.5px at 30% 40%, var(--moon) 98%, transparent), radial-gradient(2px 2px at 62% 28%, var(--moon) 98%, transparent),
      radial-gradient(3px 3px at 50% 68%, var(--moon) 98%, transparent), radial-gradient(2px 2px at 74% 60%, var(--moon) 98%, transparent),
      radial-gradient(2px 2px at 24% 76%, var(--moon) 98%, transparent), rgba(255,255,255,.12);
    box-shadow: 0 0 18px rgba(251,239,200,.25); }
  .jar::after { bottom: 72%; left: 20%; width: 60%; height: 11%; background: var(--lavender); border-radius: 4px; }
  .blocks::before, .blocks::after { display: grid; place-items: center; width: 52%; height: 44%; border-radius: 5px;
    font: 700 calc(var(--s, 1) * 16px)/1 var(--display); color: var(--cocoa); }
  .blocks::before { content: "A"; bottom: 0; left: 0; background: var(--pink); }
  .blocks::after { content: "B"; bottom: 44%; left: 24%; background: var(--sky); transform: rotate(-8deg); }
  .stack { display: flex; flex-direction: column; align-items: center; margin-left: auto; }
  .stack .vol { height: clamp(13px, 1.3vw, 18px); width: var(--w); border-radius: 3px; background-image: none;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.12); }
  .vol.wrapped { background-image:
      linear-gradient(90deg, transparent 42%, var(--coral) 42% 58%, transparent 58%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 6px, transparent 6px 12px); }
  .tag { position: absolute; right: 16px; top: 22%; font: 700 24px var(--display); color: var(--cocoa);
    background: var(--cream); padding: 0 12px; border-radius: 10px; transform: rotate(8deg); box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .plate {
    position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); z-index: 4; white-space: nowrap;
    font: 700 15px/1 var(--display); color: var(--cocoa); padding: 7px 14px 6px; border-radius: 999px;
    background: var(--cream); box-shadow: 0 3px 0 rgba(0,0,0,.45); transition: background .25s, color .25s, transform .25s;
  }
  .cell:hover .nook { box-shadow: inset 0 14px 22px rgba(0,0,0,.55), 0 0 0 3px color-mix(in srgb, var(--purple) 60%, transparent); }
  .cell input:focus-visible ~ .nook { outline: 4px solid var(--purple); outline-offset: 4px; }
  /* the chosen shelf comes forward; its books turn dark pastel purple */
  .cell input:checked ~ .nook {
    transform: scale(1.07); z-index: 3;
    background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--purple) 35%, transparent), transparent 70%), linear-gradient(var(--back), var(--back-2));
    box-shadow: inset 0 14px 22px rgba(0,0,0,.45), 0 0 0 4px var(--purple), 0 0 46px color-mix(in srgb, var(--purple) 60%, transparent);
  }
  .cell input:checked ~ .nook .vol { background-color: var(--p); }
  .cell input:checked ~ .plate { background: var(--purple); color: #fff; transform: translateX(-50%) scale(1.12); z-index: 5; }
  .cells:has(input:checked) .cell:not(:has(input:checked)) .nook { opacity: .88; }

  /* the reading table: "My own idea" */
  .desk { display: block; margin: 8px auto 0; max-width: 680px; }
  .desk-top { display: flex; align-items: center; gap: 18px; cursor: pointer; padding: 14px 22px; border-radius: 22px;
    background: var(--mint); color: var(--cocoa); box-shadow: 0 6px 0 var(--walnut-dark);
    transition: transform .15s, background .2s, color .2s; }
  .desk-top:hover { transform: translateY(-3px); }
  .desk input:checked + .desk-top { background: var(--purple); color: #fff; box-shadow: 0 6px 0 var(--walnut-dark), 0 0 40px color-mix(in srgb, var(--purple) 60%, transparent); }
  .desk input:focus-visible + .desk-top { outline: 4px solid var(--purple); outline-offset: 4px; }
  .notebook { flex: none; width: 66px; height: 48px; border-radius: 6px; position: relative; border: 3px solid var(--cocoa);
    background: linear-gradient(90deg, #fff 47%, var(--cocoa) 47% 53%, #fff 53%); }
  .notebook::before { content: ""; position: absolute; inset: 8px 6px; background:
    repeating-linear-gradient(transparent 0 6px, color-mix(in srgb, var(--purple) 55%, transparent) 6px 8px); }
  .desk-top b { font: 700 21px var(--display); display: block; }
  .desk-top small { font-size: 15px; font-weight: 600; opacity: .9; }
  #ideaBox { margin-top: 14px; }
  #ideaBox label { display: block; margin-bottom: 6px; text-align: center; font: 600 18px var(--display); color: var(--on-wood); }
  textarea {
    width: 100%; min-height: 120px; resize: vertical; font: 600 18px/34px var(--ui); color: var(--cocoa);
    background: repeating-linear-gradient(transparent 0 33px, color-mix(in srgb, var(--purple) 30%, transparent) 33px 35px), #fff;
    border: 3px solid transparent; border-radius: 20px; padding: 8px 18px; box-shadow: 0 6px 0 var(--walnut-dark);
  }
  textarea:focus { outline: none; border-color: var(--purple); }
  .count { text-align: right; font-size: 13px; opacity: .7; margin-top: 8px; }

  .chosen { text-align: center; min-height: 3.2em; margin: 0 auto; max-width: 560px; font-weight: 600; color: var(--on-wood); }
  .chosen b { font: 700 24px var(--display); color: var(--accent-text); display: block; }

  .error { color: #ffb4a6; text-align: center; min-height: 1.6em; margin: 0; font-weight: 700; }
  .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  button { font: 700 20px var(--display); border-radius: 999px; cursor: pointer; padding: 14px 34px; border: 0; }
  button:disabled { opacity: .5; cursor: default; }
  .gold { color: #fff; background: var(--purple); box-shadow: 0 6px 0 var(--purple-deep), 0 10px 24px rgba(0,0,0,.35);
    transition: transform .12s, box-shadow .12s, background .2s; }
  .gold:hover:not(:disabled) { background: var(--purple-deep); transform: translateY(-2px); }
  .gold:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--purple-deep); }
  .ghost { background: transparent; color: var(--text); border: 2px solid var(--line); padding: 11px 22px; }
  .ghost:hover:not(:disabled) { border-color: var(--accent-text); }

  /* ---------- the librarian: big, in the corner, leaning into the bookcase a little ---------- */
  .librarian { position: fixed; right: 0; bottom: 0; width: 210px; z-index: 20; pointer-events: none; }
  .librarian { --coat: #3f2a5c; --lapel: #2c1c42; --vest: #e0b04f; --tie: #f39fb8; --tie-dark: #e07f9c; --held: #f9e7a1; }
  .librarian svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.55)); }
  .bubble {
    position: absolute; right: 150px; bottom: 230px; width: 230px; padding: 12px 16px; border-radius: 22px 22px 6px 22px;
    background: var(--cream); color: var(--cocoa); font: 600 16px/1.4 var(--display);
    box-shadow: 0 8px 20px rgba(0,0,0,.45); transition: opacity .3s;
  }
  .bubble:empty { opacity: 0; }
  .lids { transform-box: fill-box; transform-origin: center; transform: scaleY(0); }
  .blink .lids { transform: scaleY(1); }
  main { padding-bottom: 260px; }
  body.reading .librarian { display: none; }
  @media (min-width: 1000px) {
    :root { --lib-w: clamp(320px, 30vw, 470px); }
    main { margin-left: max(16px, calc((100vw - var(--lib-w) - 1500px) / 2)); margin-right: calc(var(--lib-w) - 110px);
      padding-bottom: 80px; }
    .librarian { width: var(--lib-w); right: -10px; }
    .bubble { right: 40px; left: 30px; width: auto; bottom: calc(var(--lib-w) * 1.03); border-radius: 22px 22px 22px 6px; }
    .bubble::after { content: ""; position: absolute; left: 30%; bottom: -14px; width: 24px; height: 16px; background: var(--cream);
      clip-path: polygon(0 0, 100% 0, 10% 100%); }
    body.reading .librarian { display: block; }
    body.reading main { margin-right: calc(var(--lib-w) + 8px); }
  }
  @media (min-width: 761px) and (max-width: 1199px) { .cells { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  /* the bookcase carries on behind the librarian */
  .back { display: none; }
  @media (min-width: 1000px) {
    main { margin-left: auto; margin-right: auto; }
    .form { padding-right: calc(var(--lib-w) - 30px); }
    .back { display: grid; position: absolute; top: 54px; bottom: 34px; right: clamp(14px, 2.4vw, 34px);
      width: calc(var(--lib-w) - 30px - clamp(14px, 2.4vw, 34px) - 22px); grid-auto-rows: clamp(170px, 19vw, 250px);
      gap: 26px; align-content: start; overflow: hidden; }
    .back .nook { height: auto; }
    .form::before { margin-right: calc(-1 * (var(--lib-w) - 30px)); }
  }
</style>
<style>
  /* ---------- the cover ---------- */
  .cover-wrap { display: grid; place-items: center; padding: 10px 0 20px; }
  .cover {
    position: relative; width: min(400px, 88vw); aspect-ratio: 3 / 4; border-radius: 10px 28px 28px 10px;
    background:
      linear-gradient(90deg, rgba(0,0,0,.10) 0 16px, rgba(255,255,255,.35) 16px 19px, transparent 19px),
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.45), transparent 60%),
      var(--cloth, var(--lavender));
    box-shadow: 0 24px 50px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 40px 34px 40px 48px; color: var(--cocoa);
  }
  .cover::before {      /* a dashed stitch around the cover */
    content: ""; position: absolute; inset: 22px 20px 22px 36px; border: 3px dashed rgba(255,255,255,.9);
    border-radius: 12px 20px 20px 12px; pointer-events: none;
  }
  .cover .moon { width: 52px; height: 52px; border-radius: 50%; box-shadow: inset -13px 4px 0 0 var(--butter);
    transform: rotate(-20deg); margin-bottom: 22px; }
  .cover h2 { font: 700 clamp(28px, 6vw, 38px)/1.15 var(--display); margin: 0; text-wrap: balance; position: relative; }
  .cover .for { font: 600 19px var(--ui); margin: 16px 0 26px; color: var(--cocoa); position: relative; }
  .cover button { position: relative; }
  @media (prefers-reduced-motion: no-preference) {
    .writing h2 { background: linear-gradient(100deg, var(--cocoa) 40%, var(--purple) 50%, var(--cocoa) 60%) 0 0 / 300% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 2.6s linear infinite; }
    @keyframes foil { to { background-position: -150% 0; } }
  }

<div class="sky-moon" aria-hidden="true"></div>

<main>
  <header class="masthead">
    <h1 id="title">The Bedtime Library</h1>
  </header>

  <!-- 1. Choosing: the library card, then a shelf -->
  <form class="form" id="storyForm" novalidate>
    <div class="back" id="backShelves" aria-hidden="true"></div>
    <div class="card">
      <div class="field">
        <label class="label" for="name">Child's name</label>
        <input type="text" id="name" maxlength="30" autocomplete="off" placeholder="They become the hero">
      </div>
      <div class="field">
        <span class="label" id="ageLabel">Age</span>
        <div class="ages" id="ages" role="radiogroup" aria-labelledby="ageLabel"></div>
      </div>

        <label class="label" for="today">Something from today <span class="opt">(optional)</span></label>
        <input type="text" id="today" maxlength="150" autocomplete="off" placeholder="We went to the zoo and saw a giraffe">
      </div>
      <p class="hint">Leave the name empty and the librarian picks a new hero.</p>
    </div>

    <fieldset>
      <legend class="case-title">Choose a shelf</legend>
      <div class="case">
        <div class="cells" id="books"></div>
      </div>
      <label class="choice desk" id="desk">
        <input type="radio" name="genre" value="custom">
        <span class="desk-top">
          <span class="notebook" aria-hidden="true"></span>
          <span><b>Or write your own idea</b></span>
        </span>

    </fieldset>

  </form>

  <!-- 2. Writing: the cover being stamped -->
  <section class="cover-wrap" id="waiting" hidden aria-live="polite">
    <div class="cover writing" id="waitCover">
      <div class="moon" aria-hidden="true"></div>
      <h2>Once upon a time…</h2>
      <p class="for" id="waitFor"></p>
    </div>
    <p class="whisper" id="whisper"></p>
  </section>

  <!-- 4. Reading -->
  <section class="reader" id="reader" hidden>
    <div class="toolbar">
      <h2 class="title" id="readerTitle"></h2>
      <button type="button" class="mic" id="readBtn" aria-label="Read the story aloud" title="Read aloud">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3" fill="currentColor"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="notes"></div>
    <div class="bookrow">
      <button type="button" class="ghost side" id="prevBtn" aria-label="Previous page">‹</button>
      <div class="spread" id="spread" aria-live="polite"></div>
      <button type="button" class="ghost side" id="nextBtn" aria-label="Next page">›</button>
    </div>
    <div class="turns"><span id="pageCount"></span></div>

    <section class="after" id="after" hidden>
      <h3>Change something?</h3>
      <div class="chips" id="quickChanges"></div>
      <form class="change-row" id="changeForm" novalidate>
        <label for="change" style="position:absolute;left:-9999px">Your change</label>
        <input type="text" id="change" maxlength="300" placeholder="e.g. give the dragon a little sister">
        <button type="submit" class="gold">Rewrite it</button>
      </form>
      <p class="error" id="changeError" role="alert"></p>
      <div class="actions" style="margin-top:14px"><button type="button" class="ghost" id="newBtn">Choose another book</button></div>
    </section>
  </section>

  <footer>Stories for ages 5–10, checked for safety before they reach the page.</footer>
</main>

<!-- The chosen book: it flies off the shelf, the room fades into the night sky, and it opens only
     when its story has been written. -->
<div class="opened" id="opened" hidden>
  <div class="flybook" id="flybook" role="dialog" aria-modal="true" aria-labelledby="flyTitle">
    <div class="pg pg-right" id="firstPage"></div>
    <div class="cover3d" id="cover3d">
      <div class="face-front">
        <span class="moon" aria-hidden="true"></span>
        <h2 id="flyTitle"></h2>

</div>

<script>
const DEFAULT_THEME = "pastel";   // the colour scheme: pastel, honey, moonlit, cocoa or painted
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
  const value = (name) => (document.querySelector(`input[name=${name}]:checked`) || {}).value;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- the librarian ----------
  const say = (text) => { $("bubble").textContent = text || ""; };
  const pupils = [["pupilL", 82, 101], ["pupilR", 118, 101]];
  function lookAt(x, y) {
    const box = $("libSvg").getBoundingClientRect();
    const scale = box.width / 200;
    for (const [id, cx, cy] of pupils) {
      const ex = box.left + cx * scale, ey = box.top + cy * scale;
      const dx = x - ex, dy = y - ey, dist = Math.hypot(dx, dy) || 1;
      const reach = Math.min(3.6, dist / 40);
      $(id).setAttribute("cx", cx + dx / dist * reach);
      $(id).setAttribute("cy", cy + dy / dist * reach);
    }
  }
  addEventListener("mousemove", (e) => lookAt(e.clientX, e.clientY), { passive: true });
  addEventListener("touchstart", (e) => lookAt(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  addEventListener("focusin", (e) => {               // keyboard users: he watches what has focus
    const r = e.target.getBoundingClientRect();
    lookAt(r.left + r.width / 2, r.top + r.height / 2);
  });
  if (!reduceMotion) {
    (function blink() {
      setTimeout(() => {
        $("libSvg").classList.add("blink");
        setTimeout(() => { $("libSvg").classList.remove("blink"); blink(); }, 140);
      }, 3500 + Math.random() * 4000);
    })();
  }
  say("Good evening! Write the child's name, then choose a shelf.");

  // ---------- the bookcase: each kind of story is a shelf of its own books ----------
  // Colour schemes. Each one sets the sky, the wood, the chosen-shelf colour and ten book colours.
  const THEMES = {
    pastel: { name: "Pastel night",
      books: ["#dcaebb", "#e7c79a", "#ecdcae", "#a9cbb8", "#9fbadb", "#bfaee0", "#d3b5d9", "#dba99c", "#bccfa6", "#a7cfd0"],
      picks: ["#966fd6", "#a98be0", "#8762c9", "#b89ce8", "#9f7ad9"], vars: {} },
    honey: { name: "Honey oak & jewel books",
      books: ["#c97b84", "#c8734f", "#d9a441", "#8fae8b", "#4f8a8b", "#7d5a8c", "#4a6491", "#e8d8b8", "#a3a35a", "#d98e73"],
      picks: ["#e2b04a", "#d9a441", "#f0c565", "#c99532", "#e8bb57"],
      vars: { "--sky-1": "#0d1630", "--sky-2": "#18264a", "--sky-3": "#24365f", "--walnut": "#7a4a26", "--walnut-hi": "#9c6334",
              "--walnut-dark": "#4a2a12", "--back": "#2b1709", "--back-2": "#3d2412", "--purple": "#d9a441",
              "--purple-deep": "#b8862b", "--accent-text": "#f0cf7f" } },
    moonlit: { name: "Moonlit blue",
      books: ["#a9c4e8", "#e8eef8", "#7fa1d6", "#c9d6ea", "#f2e6c4", "#5f7fb8", "#b8c9e3", "#dfe8f5", "#8fb0de", "#f5edd6"],
      picks: ["#f2d27a", "#e8c25e", "#f7df9a", "#dcb44f", "#f0cc6a"],
      vars: { "--sky-1": "#08112a", "--sky-2": "#101f42", "--sky-3": "#1a2f5c", "--walnut": "#2b3a5c", "--walnut-hi": "#40547f",
              "--walnut-dark": "#161f36", "--back": "#0c1428", "--back-2": "#14203b", "--purple": "#e8c25e",
              "--purple-deep": "#c9a24d", "--accent-text": "#f2d27a" } },
    cocoa: { name: "Cocoa & blush at dusk",
      books: ["#f2c4c4", "#d9a066", "#f3e3c3", "#d98c9a", "#f2d58a", "#c97b5a", "#c9a88a", "#f5c9a8", "#b98aa0", "#e6cfa8"],
      picks: ["#d46a8c", "#e07f9e", "#c45a7c", "#e891ab", "#cf6487"],
      vars: { "--sky-1": "#1f1733", "--sky-2": "#3b2650", "--sky-3": "#6b3f62", "--walnut": "#3a2418", "--walnut-hi": "#55362a",
              "--walnut-dark": "#22140c", "--back": "#1e110b", "--back-2": "#2c1a12", "--purple": "#d46a8c",
              "--purple-deep": "#b04e70", "--accent-text": "#f2a9c0" } },
    painted: { name: "Painted cream shelves",
      books: ["#f4a7b9", "#f9c38f", "#f6dc7c", "#9fd8b6", "#94c4ec", "#b9a3e8", "#e3a6e0", "#f39a8c", "#b6d68f", "#8fd6d3"],
      picks: ["#966fd6", "#a98be0", "#8762c9", "#b89ce8", "#9f7ad9"],
      vars: { "--sky-1": "#141133", "--sky-2": "#262058", "--sky-3": "#3d3480", "--walnut": "#efe4d2", "--walnut-hi": "#fbf4e8",
              "--walnut-dark": "#c9b89c", "--back": "#d8c8ae", "--back-2": "#e6d8c0", "--purple": "#966fd6",
              "--purple-deep": "#7a55bd", "--accent-text": "#7a55bd", "--on-wood": "#4a2e1f" } },
  };
  const THEME = THEMES[new URLSearchParams(location.search).get("theme")] || THEMES[DEFAULT_THEME];
  for (const [k, v] of Object.entries(THEME.vars)) document.documentElement.style.setProperty(k, v);
  const names = ["pink", "peach", "butter", "mint", "sky", "lavender", "lilac", "coral", "sage", "aqua"];
  const P = Object.fromEntries(names.map((n, i) => [n, THEME.books[i]]));
  names.forEach((n, i) => document.documentElement.style.setProperty("--" + n, THEME.books[i]));
  const ALL = Object.values(P);
  const SHELF = {          // [face-out cover, spine colours] — all pastel
    auto:           [P.butter,   ALL],
    fairy_tale:     [P.pink,     [P.pink, P.lilac, P.butter, P.lavender, P.peach]],
    magical:        [P.lavender, [P.lavender, P.aqua, P.lilac, P.sky, P.butter]],
    calming:        [P.sky,      [P.sky, P.mint, P.lavender, P.aqua, P.peach]],
    good_manners:   [P.peach,    [P.peach, P.coral, P.butter, P.sage, P.pink]],
    healthy_habits: [P.sage,     [P.sage, P.mint, P.butter, P.peach, P.aqua]],
    animal_friends: [P.butter,   [P.butter, P.peach, P.sage, P.coral, P.mint]],
    adventure:      [P.mint,     [P.mint, P.sky, P.coral, P.butter, P.sage]],
    space_science:  [P.aqua,     [P.aqua, P.sky, P.lavender, P.mint, P.lilac]],
    funny:          [P.coral,    [P.coral, P.butter, P.aqua, P.pink, P.mint]],
    brave_hearts:   [P.lilac,    [P.lilac, P.coral, P.peach, P.sky, P.sage]],
    friendship:     [P.pink,     [P.pink, P.sky, P.mint, P.butter, P.lavender]],
    custom:         [P.mint,     ALL],
  };
  function seeded(key) {                    // the same books on the same shelf every time
    let h = 2166136261;
    for (const c of key) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
    return () => ((h = Math.imul(h ^ (h >>> 13), 1274126177)) >>> 0) / 4294967296;
  }
  function vol(colour, w, h, cls) {
    const v = el("span", null, "vol" + (cls ? " " + cls : ""));
    v.style.setProperty("--c", colour); v.style.setProperty("--w", w + "px"); v.style.setProperty("--h", h + "%");
    return v;
  }
  const PURPLES = THEME.picks;
  // Every shelf is tidy: one full row of books, edge to edge, with at most one thing at each end
  // (a pile lying flat, a book facing out, a leaning book, or a little object). What changes from
  // shelf to shelf is which ends are used and the shape of the row's heights.
  const LEFT  = [null, "stack", "face", null, "tallstack", null, "stack", "face"];
  const RIGHT = ["lean", "stack", "tallstack", "lean", "decor", null, "stack", "lean"];
  const SHAPES = ["even", "down", "up", "arch", "even", "valley"];
  const DECOR = ["jar"];
  const END_W = { stack: 50, tallstack: 54, decor: 54, face: 66 };
  function fillNook(nook, key, index) {
    const rnd = seeded(key + ":" + index), colours = (SHELF[key] || SHELF.auto)[1];
    const room = Math.max(120, nook.clientWidth - 24);
    const sc = Math.min(1.5, Math.max(0.8, room / 190));
    const auto = key === "auto";
    const left = auto ? null : LEFT[index % LEFT.length];
    let right = auto ? null : RIGHT[(index * 3 + 1) % RIGHT.length];
    if (left === "decor" && right === "decor") right = "stack";
    let n = (index * 2) % colours.length, k = 0;
    const book = (w, h, cls) => {
      const v = vol(colours[n++ % colours.length], Math.round(w), h, cls);
      v.style.setProperty("--p", PURPLES[k++ % PURPLES.length]);
      return v;
    };
    const leanH = 76, leanDeg = 12;
    const tip = Math.round(nook.clientHeight * leanH / 100 * Math.sin(leanDeg * Math.PI / 180)) + 2;
    const endW = (p) => !p ? 0 : p === "lean" ? 15 * sc + tip : END_W[p] * sc;
    const end = (p) => {
      if (p === "stack" || p === "tallstack") {
        const st = el("span", null, "stack");
        const count = p === "stack" ? 3 : 5;
        for (let i = 0; i < count; i++) st.appendChild(book((END_W[p] - 4 - (i % 2) * 6) * sc, 0));
        return st;
      }
      if (p === "face") return book(END_W.face * sc - 6, 74, "face");
      if (p === "lean") {
        const v = book(15 * sc, leanH, "lean");
        v.style.setProperty("--r", leanDeg + "deg");
        v.style.marginRight = tip + "px";
        return v;
      }
      const d = el("span", null, "decor " + DECOR[(index + (key.length % 4)) % DECOR.length]);
      d.style.setProperty("--s", sc);
      return d;
    };
    // the row fills exactly the space between the ends
    const GAP = 3;
    const rowW = room - endW(left) - endW(right) - (left ? 8 : 0) - (right ? 8 : 0);
    const count = Math.max(4, Math.round(rowW / (18 * sc)));
    const weights = Array.from({ length: count }, () => 0.8 + rnd() * 0.45);
    const total = weights.reduce((a, b) => a + b, 0);
    const shape = SHAPES[(index + key.length) % SHAPES.length];
    if (left) { const e = end(left); e.style.marginRight = "8px"; nook.appendChild(e); }
    weights.forEach((wt, i) => {
      const t = count > 1 ? i / (count - 1) : 0.5;
      const base = { even: 84, down: 92 - t * 22, up: 70 + t * 22, arch: 72 + Math.sin(t * Math.PI) * 20,
                     valley: 92 - Math.sin(t * Math.PI) * 18 }[shape];
      const h = Math.min(94, Math.max(62, base + (rnd() - 0.5) * 8));
      nook.appendChild(book(wt / total * (rowW - GAP * (count - 1)), h, auto ? "wrapped" : ""));
    });
    if (right) { const e = end(right); if (right !== "lean") e.style.marginLeft = "8px"; nook.appendChild(e); }
    if (auto) nook.appendChild(el("span", "?", "tag"));
  }
  function fillBack() {                     // the part of the bookcase behind the librarian, lined up with the rows
    const back = $("backShelves"), books = $("books");
    back.replaceChildren();
    if (!getComputedStyle(back).display || getComputedStyle(back).display === "none") return;
    const first = books.querySelector(".nook");
    if (!first) return;
    const rowH = first.offsetHeight, pitch = rowH + 26;
    const formTop = $("storyForm").getBoundingClientRect().top;
    const booksTop = books.getBoundingClientRect().top - formTop;
    const above = Math.max(0, Math.floor((booksTop - 50) / pitch));
    back.style.top = (booksTop - above * pitch) + "px";
    back.style.gridAutoRows = rowH + "px";
    const keys = Object.keys(SHELF).filter(k => k !== "auto" && k !== "custom");
    for (let i = 0; i < above + 6; i++) {
      const nook = el("span", null, "nook");
      back.appendChild(nook);
      fillNook(nook, keys[(i * 5 + 3) % keys.length], i + 3);
    }
  }
  function shelveAll() {
    document.querySelectorAll(".cell").forEach((cell, i) => {
      const nook = cell.querySelector(".nook");
      nook.replaceChildren(); fillNook(nook, cell.querySelector("input").value, i);
    });
    fillBack();
  }
  let resizeTimer;                          // re-shelve when the window changes size
  addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(shelveAll, 200); });
  const CLOTH = Object.fromEntries(Object.entries(SHELF).map(([k, v]) => [k, [v[0]]]));

  const state = { storyId: null, name: "", pages: [], at: 0, genreKey: "auto", reading: false };

  let genres = [];
  fetch("/api/options").then(r => r.json()).then(opts => {
    for (let a = opts.minAge; a <= opts.maxAge; a++) {
      const label = el("label", null, "choice age");
      const input = document.createElement("input");
      input.type = "radio"; input.name = "age"; input.value = a;
      label.append(input, el("span", String(a)));
      $("ages").appendChild(label);
    }
    genres = opts.genres;
    for (const g of genres.filter(g => g.key !== "custom")) {
      const cell = el("label", null, "choice cell");
      const input = document.createElement("input");
      input.type = "radio"; input.name = "genre"; input.value = g.key;
      const nook = el("span", null, "nook");
      cell.append(input, nook, el("span", g.name, "plate"));
      cell.title = g.blurb;
      $("books").appendChild(cell);
    }
    shelveAll();                          // after the shelves are on the page, so the books can size to them
  }).catch(() => showError("formError", "The story server isn't answering. Start it with: python app.py"));

  // ---------- choosing a shelf: a book comes off it, flies to the middle and opens ----------
  let flyKey = "auto";
  function openBook(key, from) {
    const g = genres.find(x => x.key === key) || { name: "Your own idea", blurb: "" };
    const custom = key === "custom";
    const name = $("name").value.trim(), age = value("age");
    flyKey = key;
    $("flyTitle").textContent = custom ? "Your own idea" : g.name;
    $("bookFor").textContent = name ? `a story for ${name}${age ? ", age " + age : ""}` : (age ? `a story for a ${age}-year-old` : "a story for tonight");
    $("ideaBox").hidden = !custom;
    $("flybook").style.setProperty("--cloth", (CLOTH[key] || CLOTH.auto)[0]);
    $("flybook").classList.remove("open", "writing", "ready");
    $("opened").classList.remove("fading");
    showError("formError", "");
    $("opened").hidden = false;
    document.body.classList.add("bookopen");
    requestAnimationFrame(() => $("opened").classList.add("night"));     // the room fades into the night sky
    const ready = () => (custom ? $("idea") : $("makeBtn")).focus({ preventScroll: true });
    if (reduceMotion || !from) return ready();
    const book = $("flybook"), to = book.getBoundingClientRect(), r = from.getBoundingClientRect();
    const fly = book.animate([
      { transform: `translate(${r.left - to.left}px, ${r.top - to.top}px) scale(${r.width / to.width}, ${r.height / to.height})` },
      { transform: `translate(${(r.left - to.left) * 0.35}px, ${(r.top - to.top) * 0.35 - 40}px) scale(0.75) rotate(-4deg)`, offset: 0.6 },
      { transform: "none" }], { duration: 900, easing: "cubic-bezier(.3,.7,.2,1)" });
    fly.finished.then(ready).catch(ready);
  }
  // the story has arrived: the cover gets its title, then the book opens onto the first page
  function openStory(s) {
    $("flyTitle").textContent = s.title;
    $("titlePage").replaceChildren(titlePageContent(s.title));
    $("firstPage").replaceChildren(...pageNode(1).childNodes);
    $("flybook").classList.add("ready");
    $("flybook").classList.remove("writing");
    const wait = (ms) => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
    return wait(500).then(() => { $("flybook").classList.add("open"); return wait(1500); }).then(() => {
      // Where the open book is now: two pages wide (the cover swung left), or one on phones.
      const r = $("flybook").getBoundingClientRect();
      const wide = !matchMedia("(max-width: 760px)").matches;
      const from = wide ? { left: r.left - r.width, top: r.top, width: r.width * 2, height: r.height } : r;
      show("reader", true); render();
      $("opened").classList.add("fading");                               // the open book gives way to the reader
      if (!reduceMotion) {
        // FLIP: start the reader's book exactly over the open book, then ease it to its place,
        // so the book grows smoothly instead of jumping to its new size.
        const to = $("spread").getBoundingClientRect();
        const k = from.width / to.width;
        const dx = (from.left + from.width / 2) - (to.left + to.width / 2);
        const dy = (from.top + from.height / 2) - (to.top + to.height / 2);
        $("spread").animate([{ transform: `translate(${dx}px, ${dy}px) scale(${k})` }, { transform: "none" }],
                            { duration: 700, easing: "cubic-bezier(.3,.7,.2,1)" });
        for (const id of ["prevBtn", "nextBtn"]) $(id).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700 });
      }
      return wait(700);
    }).then(() => {
      $("opened").hidden = true;
      $("opened").classList.remove("night", "fading");
      $("flybook").classList.remove("open");
    });
  }
  function closeBook() {
    if ($("flybook").classList.contains("writing")) return;
    $("opened").hidden = true;
    $("opened").classList.remove("night");
    document.body.classList.remove("bookopen");
  }
  $("closeBook").addEventListener("click", closeBook);
  $("opened").addEventListener("click", (e) => { if (e.target === $("opened")) closeBook(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("opened").hidden) closeBook(); });
  // clicking a shelf (even the one already chosen) takes a book off it
  document.querySelector(".form").addEventListener("click", (e) => {
    const input = e.target.closest("input[name=genre]");
    if (!input) return;
    const holder = input.closest(".cell, .desk");
    const vols = holder.querySelectorAll(".vol:not(.stack .vol)");
    const from = vols.length ? vols[Math.floor(vols.length / 2)] : holder;
    requestAnimationFrame(() => openBook(input.value, from));
  });
  document.querySelector(".form").addEventListener("change", (e) => {
    if (e.target.name === "age") say(`Age ${e.target.value}. Now choose a shelf.`);
  });
  $("idea").addEventListener("input", () => { $("ideaCount").textContent = $("idea").value.length; });

  // ---------- views ----------
  const LINES = { waiting: "Let me find just the right words…" };
  function show(view, instant) {
    for (const id of ["storyForm", "waiting", "reader"]) $(id).hidden = id !== view;
    document.body.classList.toggle("reading", view === "reader" || view === "waiting");
    if (view !== "storyForm") document.body.classList.remove("bookopen");
    if (LINES[view]) say(LINES[view]);
    else if (view === "storyForm") say("Another one? Choose a shelf.");
    window.scrollTo({ top: 0, behavior: reduceMotion || instant ? "auto" : "smooth" });
  }
  function showError(id, msg) { $(id).textContent = msg || ""; }
  function paintCloth(key) {
    const cloth = (CLOTH[key] || CLOTH.auto)[0];
    $("waitCover").style.setProperty("--cloth", cloth);
  }

  // ---------- talking to the server ----------
  async function post(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "That didn't work. Please try again.");
    return data.job;
  }
  const WHISPERS = ["Choosing the right words…", "Drawing the first page…", "Checking it's gentle enough for bedtime…",
                    "Turning down the corners…", "Stamping the cover…", "Nearly ready…"];
  async function follow(job) {
    let tick = 0;
    const whisper = (t) => { $("whisper").textContent = t; $("bookWhisper").textContent = t; };
    whisper(WHISPERS[0]);
    $("bookSteps").replaceChildren();
    let shown = 0;
    for (;;) {
      await new Promise(r => setTimeout(r, 800));
      const data = await (await fetch(`/api/job/${job}`)).json();
      // the storyteller's real steps (sent by the agent as "✦ ..."), newest last
      const steps = (data.events || []).map(e => e.msg).filter(m => m.startsWith("\u2726 ")).map(m => m.slice(2));
      if (steps.length > shown) {
        shown = steps.length;
        whisper(steps[steps.length - 1]);
        $("bookSteps").replaceChildren(...steps.slice(-4).map((t, i, a) => el("li", t, i === a.length - 1 ? "now" : "")));
      } else if (!steps.length && ++tick % 6 === 0) whisper(WHISPERS[Math.min(tick / 6, WHISPERS.length - 1)]);
      if (data.status === "done") return data.result;
      if (data.status === "error") throw new Error(data.error);
    }
  }

  $("storyForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    showError("formError", "");
    const body = { name: $("name").value.trim(), age: value("age"), genre: value("genre") || "auto",
                   idea: $("idea").value.trim(), today: $("today").value.trim() };
    if (!body.age) return showError("formError", "Choose an age on the library card first.");
    if (body.genre === "custom" && !body.idea) return showError("formError", "Write what the story should be about.");
    state.name = body.name;
    state.genreKey = body.genre;
    $("makeBtn").disabled = true;
    $("flybook").classList.add("writing");
    showError("formError", "");
    try {
      const job = await post("/api/story", body);
      paintCloth(body.genre);
      const story = await follow(job);
      prepareBook(story);
      await openStory(story);
      $("readBtn").focus({ preventScroll: true });
    } catch (err) {
      showError("formError", err.message);
    } finally {
      $("makeBtn").disabled = false;
      $("flybook").classList.remove("writing");
    }
  });

  // ---------- the finished book ----------
  function prepareBook(s) {
    stopReading();
    state.storyId = s.story_id;
    state.genreKey = s.genre_key || state.genreKey;
    state.pages = [null, ...s.pages];       // a title page first, then the story
    state.title = s.title;
    state.at = 0;
    paintCloth(state.genreKey);
    $("readerTitle").textContent = s.title;
    $("notes").replaceChildren(...(s.notes || []).map(n => el("p", n.startsWith("I'll") ? n : `Made gentler for bedtime: ${n}`, "note")));
    $("change").value = "";
    showError("changeError", s.unchanged ? "The story stayed the same. Describe a change to the story itself." : "");
  }
  function showBook(s) {
    prepareBook(s);
    show("reader");
    render();
    $("readBtn").focus({ preventScroll: true });
  }
  function titlePageContent(title) {
    const box = el("div", null, "title-page");
    const h = el("h2"); h.appendChild(el("span", title, "s"));
    box.append(el("span", null, "moon small"), h,
               el("p", state.name ? `a story for ${state.name}` : "a story for tonight", "for"), el("p", "✦", "end-mark"));
    return box;
  }

  const perView = () => (matchMedia("(max-width: 760px)").matches ? 1 : 2);
  function sentences(text) {
    return text.match(/[^.!?…]+(?:[.!?…]+["”’)]*|$)\s*/g) || [text];
  }
  function pageNode(i) {
    const page = el("div", null, "page" + (i === 1 ? " first" : ""));
    if (state.pages[i] === null) { page.classList.add("titled"); page.appendChild(titlePageContent(state.title)); return page; }
    if (i < state.pages.length) {
      for (const para of state.pages[i].split(/\n+/).filter(t => t.trim())) {
        const p = el("p");
        for (const sent of sentences(para)) p.appendChild(el("span", sent, "s"));
        page.appendChild(p);
      }
      if (i === state.pages.length - 1) page.append(el("p", "✦ ✦ ✦", "end-mark"), el("p", "The End", "end"));
      page.appendChild(el("span", String(i), "folio"));
    }
    return page;
  }
  function render(dir) {
    const n = perView();
    state.at = Math.max(0, Math.min(state.at - (state.at % n), Math.max(0, state.pages.length - 1)));
    const spread = $("spread");
    spread.className = "spread" + (dir ? ` turn-${dir}` : "");
    spread.replaceChildren(...Array.from({ length: n }, (_, k) => pageNode(state.at + k)));
    const last = Math.min(state.at + n, state.pages.length);
    const total = state.pages.length - 1, lo = Math.max(1, state.at), hi = Math.max(1, last - 1);
    $("pageCount").textContent = lo === hi ? `Page ${hi} of ${total}` : `Pages ${lo}–${hi} of ${total}`;
    $("prevBtn").disabled = state.at === 0;
    $("nextBtn").disabled = last >= state.pages.length;
    $("after").hidden = last < state.pages.length;
  }
  function turn(step) {
    const next = state.at + step * perView();
    if (next < 0 || next >= state.pages.length) return false;
    state.at = next;
    render(step > 0 ? "next" : "prev");
    return true;
  }
  $("prevBtn").addEventListener("click", () => { stopReading(); turn(-1); });
  $("nextBtn").addEventListener("click", () => { stopReading(); turn(1); });
  document.addEventListener("keydown", (e) => {
    if ($("reader").hidden || e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { stopReading(); turn(1); }
    if (e.key === "ArrowLeft") { stopReading(); turn(-1); }
  });
  let touchX = null;
  $("spread").addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  $("spread").addEventListener("touchend", (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) { stopReading(); turn(dx < 0 ? 1 : -1); }
    touchX = null;
  });
  addEventListener("resize", () => { if (!$("reader").hidden && !state.reading) render(); });

  // ---------- read aloud: this computer's own voices (nothing leaves the computer) ----------
  // The softest voices are listed first: on a Mac, the downloadable "Premium" and
  // "Enhanced" women's voices (Ava, Zoe, Samantha...) sound far smoother than the default.
  const synth = window.speechSynthesis;
  const NICE = ["Premium", "Enhanced", "Natural", "Ava", "Zoe", "Allison", "Samantha", "Serena", "Susan",
                "Karen", "Moira", "Tessa", "Fiona", "Kate", "Aria", "Jenny", "Libby", "Sonia",
                "Google UK English Female", "Google US English", "Female", "Zira", "Hazel"];
  const niceness = (v) => NICE.reduce((score, w, i) => v.name.includes(w) ? score + (NICE.length - i) : score, 0);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const voices = () => (synth ? synth.getVoices() : []).filter(v => v.lang && v.lang.startsWith("en"))
                                                     .sort((a, b) => niceness(b) - niceness(a));

  let bestVoice = null;
  function fillVoices() {
    bestVoice = voices()[0] || null;
    $("readBtn").disabled = !bestVoice;
    $("readBtn").title = bestVoice ? "Read aloud" : "This browser has no reading voice";
  }
  fillVoices();
  if (synth && synth.addEventListener) synth.addEventListener("voiceschanged", fillVoices);

  let run = 0;
  function mark(span) {
    document.querySelectorAll(".s.reading").forEach(s => s.classList.remove("reading"));
    if (span) span.classList.add("reading");
  }
  function speak(spans, token) {
    return new Promise((resolve) => {
      const v = bestVoice;
      let i = 0;
      const next = () => {
        if (token !== run) return resolve(false);
        if (i >= spans.length) return resolve(true);
        mark(spans[i]);
        const u = new SpeechSynthesisUtterance(spans[i].textContent);
        if (v) u.voice = v;
        u.rate = 0.82; u.pitch = 0.95;                    // slower and a little lower: calm and soft
        u.onend = () => { i++; setTimeout(next, 250); };  // a small, peaceful pause between sentences
        u.onerror = () => resolve(false);
        synth.speak(u);
      };
      next();
    });
  }
  async function readAloud() {
    const token = ++run;
    for (;;) {
      const spans = Array.from($("spread").querySelectorAll(".s"));
      if (!(await speak(spans, token)) || token !== run) return;
      if (!turn(1)) { stopReading(); return; }
      await new Promise(r => setTimeout(r, 700));
      if (token !== run) return;
    }
  }
  function stopReading() {
    run++;
    state.reading = false;
    if (synth) synth.cancel();
    mark(null);
    $("readBtn").classList.remove("on");
    $("readBtn").setAttribute("aria-label", "Read the story aloud");
  }
  $("readBtn").addEventListener("click", () => {
    if (!synth) return;
    if (state.reading) return stopReading();               // the mic again stops the reading
    state.reading = true;
    $("readBtn").classList.add("on");
    $("readBtn").setAttribute("aria-label", "Stop reading");
    readAloud();
  });

  // ---------- changes ----------
  for (const text of ["Make it funnier", "Make it calmer", "Make it shorter", "Add a friendly dragon"]) {
    const b = el("button", text, "chip"); b.type = "button";
    b.addEventListener("click", () => { $("change").value = text; $("changeForm").requestSubmit(); });
    $("quickChanges").appendChild(b);
  }
  $("changeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const change = $("change").value.trim();
    if (!change) return showError("changeError", "Write the change you'd like.");
    stopReading();
    try {
      const job = await post("/api/change", { story_id: state.storyId, change });
      $("waitFor").textContent = "rewriting the story";
      show("waiting");
      showBook(await follow(job));
    } catch (err) {
      show("reader");
      showError("changeError", err.message);
    }
  });
  $("newBtn").addEventListener("click", () => { stopReading(); state.storyId = null; show("storyForm"); });
})();
</script>
</body>
</html>
